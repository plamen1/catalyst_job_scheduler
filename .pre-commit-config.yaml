---
# Kept deliberately light - fast, local, secret-scanning-focused per
# automation-design doc 05 §5.7. Slower/broader checks (ansible-lint,
# mypy, bandit, pytest, Molecule) belong in CI, not here.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      # Widen this `files:` scope once roles/<role>/filter_plugins and
      # roles/<role>/scripts exist (see aws_prefix_update's own
      # .pre-commit-config.yaml, which had to do the same thing after
      # starting schema/tests-only) - don't let it silently stay narrow
      # once there's more live Python to lint.
      - id: black
        files: ^(schema|tests|scripts)/
